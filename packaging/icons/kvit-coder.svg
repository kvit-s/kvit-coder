<?xml version="1.0" encoding="UTF-8"?>
<!-- kvit-coder application icon. First-party artwork. Geometry only, no text
     glyphs, so it renders the same without font dependencies at every size.

     The rounded dark square is what every Kvit application shares. The mark
     inside it is kvit-coder's own: a terminal prompt, a chevron and the
     cursor after it, since kvit-coder is a coding agent that runs in a
     terminal. The chevron points right, the other way from the diagonals of
     the Kvit Notes "K", and the cursor lies flat, so at 16 px the two read as
     an arrow and a dash rather than as a mirrored "K". The chevron takes the
     dark theme's CodeKeyword colour, which no other Kvit application uses;
     the cursor takes the white Kvit Notes gives its upright bar
     (kvit-ui/tokens).

     Kvit Works draws this file on the project's tile in its rail, finding it
     by its name. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a57"/>
      <stop offset="1" stop-color="#122638"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <!-- the prompt's chevron -->
  <path d="M 132 164 L 228 256 L 132 348" fill="none" stroke="#c678dd"
        stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the cursor, after the prompt -->
  <line x1="292" y1="348" x2="380" y2="348" stroke="#f4f7fa"
        stroke-width="58" stroke-linecap="round"/>
</svg>
