llm:
  base_url: "http://192.168.8.20:8080/v1"
  model: "qwen3.6-27b-mtp"
  temperature: 0
  max_output_tokens: 4096
  context: 120000
  merge_thinking: false
  verbose: 2

workspace:
  root: "/tmp/cag-smoke-msn1-eventbus"
  path_safety_mode: "block"
  allow_outside_workspace: false

agent:
  max_tool_iterations: 8

tools:
  read:
    enabled: false
  edit:
    enabled: false
  restore_file:
    enabled: false
  search:
    enabled: false
  shell:
    enabled: false
  plan:
    enabled: false
  checkpoint:
    enabled: false
  tasks:
    enabled: false

mcp:
  enabled: true
  startup_timeout: 30
  call_timeout: 900
  confirm: "trust"
  servers:
    - name: "cag"
      enabled: true
      transport: "stdio"
      command: "/home/sk/cag-mcp/bin/cag-client"
      cwd: "/tmp/cag-smoke-msn1-eventbus"
      env:
        - "CAG_SERVER=http://192.168.8.20:8400"
      tools:
        allow:
          - "cag_query"
