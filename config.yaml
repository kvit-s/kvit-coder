# Default model: Muse Spark 1.3 on the opencode.ai Go subscription, the same
# model and endpoint the `krok` CLI uses (see ~/.krok/config.toml). Export
# OPENCODE_API_KEY first, or `source ~/.config/grok/env`, which is where krok
# reads it from. The endpoint serves this model only through OpenAI's Responses
# API, and rejects any request without an x-opencode-session header.
llm:
  base_url: "https://opencode.ai/zen/go/v1"
  api_key_env: "OPENCODE_API_KEY"
  model: "muse-spark-1.3-contributor"
  api_backend: "responses"   # this endpoint answers /chat/completions with a 500 for this model
  reasoning_effort: "xhigh"   # minimal | low | medium | high | xhigh
  headers:
    # ${KVIT_RUN_ID} identifies this conversation, so two agents running at once
    # do not share one backend and compete for the same prompt cache. With -s it
    # is derived from the session name, so reopening a session lands on the
    # backend that already holds its cache.
    - "x-opencode-session=kvit-coder-${KVIT_RUN_ID}"
  context: 1048576
  merge_thinking: true  # true = merge reasoning into content, false = discard
  # Ask a reasoning model for readable text describing its thinking. Only the
  # "responses" backend sends it, and it is the only part of the reasoning
  # anyone can read — the rest comes back encrypted, to be replayed rather than
  # understood. Unset follows merge_thinking; "off" suppresses it.
  # reasoning_summary: auto
  request_timeout: 600   # seconds for one request to the model before it is retried
  verbose: 0             # 0 = off, >0 = show tool output up to N lines
  # Ask the endpoint for per-request cost and native token counts. This is
  # OpenRouter's /generation endpoint and 404s elsewhere, so it is off by
  # default; turning it on doubles the HTTP requests per iteration.
  generation_stats: false

# Previous default -- a local model behind the llama-swap-plus front door:
#   base_url: "http://192.168.8.20:8080/v1"
#   model: "ministral-3-14b"
#   context: 120000
# (a local endpoint needs no api_backend, headers or api_key_env)

workspace:
  root: "."
  # Refuse to start when another agent is already working in this directory.
  # Off by default. The lock is held for a whole turn, so a turn that stops to
  # ask a permission question blocks every other agent here until it is
  # answered, and the one that cannot get the lock exits instead of waiting.
  # Turn it on if two agents editing one checkout at once worries you more.
  lock: false
  # What happens when a tool touches a path outside the workspace. "ask_once"
  # asks the first time and remembers, "ask_always" asks every time, "warn"
  # says so and allows it, "block" refuses. "allow" is what --yolo sets: the
  # whole filesystem, read and write, with nothing asked and nothing said.
  path_safety_mode: "ask_once"  # "allow", "block", "warn", "ask_once", "ask_always"
  # Paths outside the workspace that need no permission prompt. allowed_paths
  # grants read and write to every tool; allowed_read_paths grants reading to
  # the tools that only read (Read, Search, Glob) and never to Shell, which
  # could write. /tmp is here because a scratch build or a throwaway config is
  # what it is for, and asking about each one interrupts a turn for nothing.
  allowed_paths:
    - "/tmp"

agent:
  # strong (default) or weak. "weak" keeps every mechanism written to catch a
  # model getting confused: backtracking away from a bad tool call, the
  # duplicate-call kill switch, the confirm handshake before an edit is applied,
  # scraping tool calls out of prose, fuzzy matching and indentation repair,
  # anomaly interrogation, retrying an empty answer, and keeping `sed -i`, eval
  # and interpreter one-liners away from a model that would use them instead of
  # the Edit tool. "strong" skips all of it: on a model that does not make those
  # mistakes each one is a tax.
  profile: strong
  max_tool_iterations: 1000
  project_instructions:
    enabled: true          # Load instructions before -p prompts when the file exists
    path: "CLAUDE.md"      # Relative to the directory where kvit-coder is launched

backtrack:
  enabled: false             # Enable backtracking on semantic errors (LLM misuse)
  max_retries: 5            # Max retries at same history point before falling back to error-in-history
  inject_user_message: true # On limit reached: backtrack + inject user message (with error) instead of error-in-history

tools:
  # All tools are disabled by default - explicitly enable the ones you want

  read:
    enabled: true
    max_file_size_kb: 128
    max_read_size_kb: 24
    max_partial_lines: 150
    show_line_numbers: true     # set to false for content-based edit modes (searchreplace, patch)

  images:
    enabled: true       # the ReadImage tool; -image works whenever it is passed
    max_size_mb: 15      # largest source file accepted
    max_dimension: 1568  # long edge of the normalized copy sent to the model

  edit:
    enabled: true
    mode: "lines"               # "lines" (default), "searchreplace", or "patch"
    max_file_size_kb: 128
    preview_mode: false         # stage edits and overwrites for confirmation:
                                # enables Edit.confirm/Edit.cancel and
                                # Write.confirm/Write.cancel. Off under
                                # agent.profile: strong.
    read_before_edit_msgs: 0    # require read within N messages before edit (0 = disabled)
    pending_confirm_retries: 5  # max retries when LLM ignores confirm/cancel (0 = disabled, default 5)
    fuzzy_threshold: 0.0        # for searchreplace mode: 0 = exact only, 0.8 = enable fuzzy matching
    smart_first_line_indent: false  # lines mode: auto-correct an under-indented first line (only active with preview_mode; revertible via Edit.undo_autoindent)
    max_autoindent_fix: 1       # max under-indent deficit (chars) to auto-correct; 1 = off-by-one only
    explicit_delete: false      # enable DeleteLines tool; flips lines-mode empty new_text to "blank the line" instead of delete

  restore_file:
    enabled: false

  search:
    enabled: true
    max_snippet_results: 20   # Full snippets up to this many matches
    max_compact_results: 100  # file:line:match up to this many; above saves to temp file

  shell:
    enabled: true
    # Permission comes from the command's syntax tree, one decision per simple
    # command in the line. Refused outright: sudo, su, chroot, package
    # managers, shutdown/reboot, and deleting / or your home directory.
    # On agent.profile: weak, sed -i is refused as well, to stop a model that
    # would otherwise edit files without going through the Edit tool. Needing
    # permission, which you can grant once, for the session, for this project
    # or everywhere: curl, wget, nc, dd, and mkfs and its family. On
    # agent.profile: weak, eval and interpreter one-liners are asked about too.
    allow_without_asking: false # what --yolo sets: run anything that would have asked.
                                # What is refused outright stays refused, and dd
                                # and mkfs keep asking — those cannot be undone.
    allowed_commands: []        # allowlist (empty = allow all; non-empty = deny everything else)
    disallowed_commands: []     # blocklist
    default_timeout: 120        # seconds a command gets when the call names none
    max_timeout: 600            # ceiling on what a call may ask for

  batch:
    enabled: true             # run several independent tool calls in one request

  procs:
    enabled: true             # Shell.start / Shell.output / Observe.wait — work that outlives a turn's iterations
    kill_on_exit: true        # stop everything this session started when a turn is interrupted

  question:
    enabled: true
    # Seconds a run with no terminal waits for an answer dropped in the session
    # inbox. 0 falls back at once, so a scripted or benchmark run never hangs.
    # With a terminal the tool waits as long as it takes.
    timeout: 0

  # Reaching the network. Enabling one of these is the decision to let the agent
  # out: unlike a shell curl, which is approved per command because the shell
  # can run anything, these two can only search and fetch.
  web:
    # The key is named, not written here. It is normally shared with other
    # programs -- and other machines -- and this file is checked in.
    api_key_env: "BRAVE_API_KEY"
    base_url: "https://api.search.brave.com"
    # A record of what was searched and when. Not a counter: the quota is
    # account-wide and only the provider can see what everything else spent,
    # which is why every response's x-ratelimit-* headers are read instead.
    usage_log: "~/.kvit-coder/web/usage.jsonl"

    search:
      enabled: true
      count: 5                  # results per query
      # Tries before giving up on a 429. The provider allows one request per
      # second, shared with every other program using the key, and refuses the
      # excess rather than queueing it. A refusal costs no quota, so the only
      # price of another attempt is about a second of waiting -- against a
      # failed tool result the model would spend a whole reasoning pass on.
      # A backend without a per-second limit wants 1 here.
      max_attempts: 4
      timeout: 20               # seconds for one request, retries included

    fetch:
      enabled: true
      timeout: 30               # a page can be slow in a way an API is not
      max_bytes: 5242880        # stop reading the response after this much HTML
      user_agent: ""            # blank uses the built-in one naming this tool

  plan:
    enabled: false              # group toggle for all plan.* tools
    injection_mode: "none"      # "none" or "every_step" - inject plan state after tool calls

  checkpoint:
    enabled: false              # group toggle for all checkpoint.* tools
    max_turns: 100
    temp_dir: ""
    max_file_size_kb: 1024
    excluded_patterns: []

  tasks:
    enabled: false              # Enable Tasks.* tools (disables Plan.* and Checkpoint.* tools)
    collapse: false             # Stage 2: Enable Tasks.Collapse
    plan: false                 # Stage 3: Enable plan-based Tasks tools
    # Runtime notice thresholds
    task_warn_turns: 5          # Warn after N turns in task
    task_critical_turns: 10     # Critical warning after N turns
    context_capacity_warn: 80   # Warn at N% context capacity
    max_nested_depth: 2         # Max task nesting depth warning
    notify_file_changes: true   # Notify about file changes in task

# Enhanced safety mode configuration (all features disabled by default)
safety:
  strict_mode: false            # Block unparseable commands (fail-closed)
  paranoid_mode: false          # Extra aggressive restrictions

  audit:
    enabled: false              # Enable audit logging of blocked commands
    log_dir: "~/.kvit-coder/safety-logs"
    redact_secrets: true        # Redact API keys, tokens from logs
    retention_days: 30

  git:
    block_push: false           # Block all git push (user should run manually)
    block_hard_reset: false     # Block git reset --hard
    block_checkout_discard: false  # Block git checkout -- <file>
    block_stash_drop: false     # Block git stash drop/clear
    block_clean_force: false    # Block git clean -f (allows -n/--dry-run)
    warn_branch_force_delete: false  # Warn on git branch -D

  rm:
    allow_in_temp: false        # Allow rm -rf in /tmp, /var/tmp
    allow_in_workspace_cwd: false  # Allow rm -rf in workspace subdirs
    block_workspace_root: false # Block rm -rf on workspace root

  interpreters:
    block_one_liners: false     # Block python -c, node -e, etc.
    allowed: []                 # Allowlist if blocking (e.g., ["python", "node"])

# External tool servers over the Model Context Protocol. Everything here is a
# separate program kvit-coder talks to, so its tools can reach whatever that
# program can reach -- which is why they are gated by `confirm` rather than by
# workspace path safety.
mcp:
  enabled: true
  confirm: ask_once     # block | ask_once | ask_always | trust. ask_once now
                        # means once per session, not once per turn: the answers
                        # go to <session>/mcp-approvals.json.
  servers:
    # A real browser, for the pages Web.fetch cannot read: anything that builds
    # itself with JavaScript, or answers a plain fetch with a bot check.
    #
    # The agent is one process per turn, so this server is spawned and killed
    # every turn and the browser goes with it. ${KVIT_RUN_ID} in the profile
    # path is what stops that costing a login: Chrome persists cookies and local
    # storage to that directory itself, so only the open tabs are lost and the
    # model re-navigates. It is per session because a persistent profile can
    # only be used by one browser at a time, and sessions run concurrently.
    # docs/web-tools.md section 6 is about removing the respawn entirely.
    - name: playwright
      enabled: true
      transport: stdio
      command: npx
      args:
        - "-y"
        - "@playwright/mcp@latest"
        - "--headless"
        - "--browser=chromium"
        - "--user-data-dir=/tmp/kvit-coder-browser/${KVIT_RUN_ID}"
        - "--output-dir=/tmp/kvit-coder-browser-out/${KVIT_RUN_ID}"
        - "--output-max-size=52428800"
      # Snapshots and screenshots come back as file paths under --output-dir
      # rather than inline, so /tmp being on workspace.allowed_paths is what
      # lets the model Read them without being asked about each one.
      call_timeout: 180   # a page load plus a settle is slower than an API call

# Prompt template configuration
prompts:
  use_templates: false          # Enable template-based prompt generation (default: false uses hardcoded)
  templates_dir: ""             # Override embedded templates with filesystem directory (e.g., "./prompts")
  hot_reload: false             # Reload templates on each request (useful for development)

# Anomaly interrogation / diagnostics (observability only - does not change recovery)
diagnostics:
  interrogate_on_anomaly: false       # Ask the model to explain odd behavior (loops, repeated calls) and log the Q&A
  interrogate_triggers: []            # Subset of: duplicate_call, pending_blocked, alternating_loop, fatal, backtrack ([] = all)
  interrogate_identical_threshold: 2  # Fire after N consecutive identical calls / pending-edit blocks
  interrogate_max_per_task: 3         # Hard cap on interrogations per task
  interrogate_log_dir: "benchmarks/.kvit-coder-benchmark/interrogations"  # JSONL episode logs
  interrogate_then_inject: false      # Reserved for the later recovery variant (no-op in v1)

# Final-answer output styling
ui:
  markdown: auto  # auto | always | never. auto styles markdown only on a
                  # terminal; piped output and --json stay raw markdown, and
                  # NO_COLOR or TERM=dumb disables styling.
