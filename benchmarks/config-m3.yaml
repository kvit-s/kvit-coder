llm:
  base_url: "http://192.168.8.20:8080/v1"  # Your OpenAI-compatible endpoint
  model: "zen/minimax-m3"
  context: 180000
  merge_thinking: false  # true = merge reasoning into content, false = discard
  verbose: 0             # 0 = off, >0 = show tool output up to N lines

workspace:
  root: "."
  path_safety_mode: "ask_once"  # "block", "warn", "ask_once", "ask_always"

agent:
  max_tool_iterations: 1000

backtrack:
  enabled: true             # Enable backtracking on semantic errors (LLM misuse)
  max_retries: 3            # Max retries at same history point before falling back to error-in-history
  inject_user_message: true # On limit reached: backtrack + inject user message (with error) instead of error-in-history

tools:
  # All tools are disabled by default - explicitly enable the ones you want

  read:
    enabled: true
    max_file_size_kb: 128
    max_read_size_kb: 24
    max_partial_lines: 150
    show_line_numbers: false    # content-based mode: hide gutter so the model can't copy line numbers into search text

  # PROFILE: content-based + auto-apply, aligned to qwen's trained distribution
  # (probe: qwen ranks search-replace #1, line-addressing #3; expects edits to auto-apply
  #  with no confirm step). Goal: fix C3/E5 (parallel-edit + confirm collision) with config only.
  edit:
    enabled: true
    mode: "searchreplace"       # was "lines" — content-based (old_string -> new_string), qwen's #1 searchreplace
    max_file_size_kb: 128
    preview_mode: false         # auto-apply: no edit.confirm/edit.cancel handshake (removes the C3/E5 pending-loop)
    read_before_edit_msgs: 0    # require read within N messages before edit (0 = disabled)
    pending_confirm_retries: 2  # (inert with preview_mode off)
    fuzzy_threshold: 0.0        # gates ONLY the fuzzy level; whitespace-normalization is governed by exact_match_only below
    exact_match_only: true      # byte-exact (Level 0) only: no rstrip/normalization/fuzzy. A non-exact search returns a clean no-match instead of a silently re-anchored (line-start) splice that corrupts indentation.
    # NOTE: the flags below are lines-mode features and are INERT in searchreplace mode
    # (autoindent needs preview_mode; the ""-blank flip lives in lines apply). Left for easy revert.
    smart_first_line_indent: true
    max_autoindent_fix: 1
    explicit_delete: true

  restore_file:
    enabled: true

  search:
    enabled: true
    max_snippet_results: 20   # Full snippets up to this many matches
    max_compact_results: 100  # file:line:match up to this many; above saves to temp file

  shell:
    enabled: true
    # Always blocked: sudo, su, apt, yum, brew, shutdown, reboot, chroot, mkfs, dd, sed -i, awk, cd
    allowed_commands: []        # allowlist (empty = allow all)
    disallowed_commands: []     # blocklist (checked after allowlist)
    allow_interpreters: true    # lift the default block on interpreter one-liners (python -c, node -e, perl -e, ...). Safe here: SWE-bench runs in a Docker container and uses python -c to introspect the codebase. Still blocks sudo/su/nc/curl/rm -rf etc.

  plan:
    enabled: false              # group toggle for all plan.* tools
    mode: "write"              # "write" (default, OpenCode/Codex-style full-list rewrite) | "incremental" (legacy 5-tool)
    injection_mode: "every_step"      # "none" or "every_step" - inject plan state after tool calls

  checkpoint:
    enabled: false              # group toggle for all checkpoint.* tools
    max_turns: 100
    temp_dir: ""
    max_file_size_kb: 1024
    excluded_patterns: []

  tasks:
    enabled: false              # Enable Tasks.* tools (disables Plan.* and Checkpoint.* tools)
    collapse: false             # Stage 2: Enable Tasks.Collapse
    plan: false                 # Stage 3: Enable plan-based Tasks tools
    # Runtime notice thresholds
    task_warn_turns: 5          # Warn after N turns in task
    task_critical_turns: 10     # Critical warning after N turns
    context_capacity_warn: 80   # Warn at N% context capacity
    max_nested_depth: 2         # Max task nesting depth warning
    notify_file_changes: true   # Notify about file changes in task

# Enhanced safety mode configuration (all features disabled by default)
safety:
  strict_mode: true            # Block unparseable commands (fail-closed)
  paranoid_mode: false          # Extra aggressive restrictions

  audit:
    enabled: false              # Enable audit logging of blocked commands
    log_dir: "~/.kvit-coder/safety-logs"
    redact_secrets: true        # Redact API keys, tokens from logs
    retention_days: 30

  git:
    block_push: false           # Block all git push (user should run manually)
    block_hard_reset: false     # Block git reset --hard
    block_checkout_discard: false  # Block git checkout -- <file>
    block_stash_drop: false     # Block git stash drop/clear
    block_clean_force: false    # Block git clean -f (allows -n/--dry-run)
    warn_branch_force_delete: false  # Warn on git branch -D

  rm:
    allow_in_temp: false        # Allow rm -rf in /tmp, /var/tmp
    allow_in_workspace_cwd: false  # Allow rm -rf in workspace subdirs
    block_workspace_root: false # Block rm -rf on workspace root

  interpreters:
    block_one_liners: false     # Block python -c, node -e, etc.
    allowed: []                 # Allowlist if blocking (e.g., ["python", "node"])

# Prompt template configuration
prompts:
  use_templates: false          # Enable template-based prompt generation (default: false uses hardcoded)
  templates_dir: ""             # Override embedded templates with filesystem directory (e.g., "./prompts")
  hot_reload: false             # Reload templates on each request (useful for development)

# Improvement 2: anomaly interrogation / logging (observability only - does not change recovery)
diagnostics:
  interrogate_on_anomaly: true        # Ask qwen to explain loops / repeated calls / ignored confirm-cancel; log the Q&A
  interrogate_triggers: []            # [] = all: duplicate_call, pending_blocked, alternating_loop, fatal, backtrack
  interrogate_identical_threshold: 2  # Fire after N consecutive identical calls / pending-edit blocks
  interrogate_max_per_task: 3         # Hard cap on interrogations per task
  interrogate_log_dir: ".kvit-coder-benchmark/interrogations"  # JSONL logs (relative to benchmarks/ launch dir, alongside results/ and workspace/)
  interrogate_then_inject: false      # Reserved for the later recovery variant (no-op in v1)
