# Haystack (Needle Retrieval) Benchmarks
# Large context window tests - no tool usage
# Text injected into prompt, questions appended
#
# Run with: kvit-coder --bench-haystack
#
# Runner behavior:
# 1. Groups benchmarks by haystack for prompt caching
# 2. Loads haystack content once as prefix
# 3. Appends each question as suffix
# 4. Disables tools (pure context retrieval)
# 5. Does NOT log full haystack to terminal (too large)

haystacks:
  kvit-coder:
    file: "haystacks/kvit-coder.go.txt"
    generate: "scripts/amalgamate-go.sh"
    description: "kvit-coder Go source amalgamated (~32k lines, ~1MB)"

benchmarks:
  # ------------------------------------------
  # 1-hop retrieval: find single fact
  # ------------------------------------------

  - id: 1H1
    name: "Default constant value"
    haystack: kvit-coder
    task: "What is the default value of maxFileSizeKB in the checkpoint Manager?"
    validation:
      - type: output_contains
        expected: "1024"
    tags: ["1-hop", "constant"]

  - id: 1H2
    name: "Struct field type"
    haystack: kvit-coder
    task: "In the checkpoint.Manager struct, what is the type of the 'mu' field?"
    validation:
      - type: output_contains
        expected: "sync.RWMutex"
    tags: ["1-hop", "struct"]

  - id: 1H3
    name: "Default exclude pattern"
    haystack: kvit-coder
    task: "What is the first default exclude pattern used by checkpoint.NewManager?"
    validation:
      - type: output_contains
        expected: ".git/*"
    tags: ["1-hop", "config"]

  - id: 1H4
    name: "Git environment variable"
    haystack: kvit-coder
    task: "What email address is set in GIT_AUTHOR_EMAIL when creating checkpoint commits?"
    validation:
      - type: output_contains
        expected: "go-coder@local"
    tags: ["1-hop", "env"]

  # ------------------------------------------
  # 2-hop retrieval: follow one call/reference
  # ------------------------------------------

  - id: 2H1
    name: "Safety rule registration"
    haystack: kvit-coder
    task: "NewChecker creates a Registry and registers rules. What are all the rule types registered?"
    validation:
      - type: output_contains
        expected: "GitRule"
      - type: output_contains
        expected: "RmRule"
      - type: output_contains
        expected: "FindRule"
      - type: output_contains
        expected: "XargsRule"
    tags: ["2-hop", "registration"]

  - id: 2H2
    name: "Command check flow"
    haystack: kvit-coder
    task: "When Checker.Check validates a command, what function parses the command string, and what is the maximum unwrap depth?"
    validation:
      - type: output_contains
        expected: "ParseCommand"
      - type: output_contains
        expected: "5"
    tags: ["2-hop", "flow"]

  - id: 2H3
    name: "Checkpoint tag naming"
    haystack: kvit-coder
    task: "In checkpoint.Manager, what is the format of git tags created for each turn, and where is the checkpoint directory created?"
    validation:
      - type: output_contains
        expected: "turn-"
      - type: output_contains
        expected: "TempDir"
    tags: ["2-hop", "naming"]

  - id: 2H4
    name: "Strict mode behavior"
    haystack: kvit-coder
    task: "When StrictMode is enabled in SafetyConfig and ParseCommand fails, what RuleResult action is returned?"
    validation:
      - type: output_contains
        expected: "Block"
    tags: ["2-hop", "error-handling"]

  # ------------------------------------------
  # 3-hop retrieval: follow multiple calls
  # ------------------------------------------

  - id: 3H1
    name: "Restore chain"
    haystack: kvit-coder
    task: "Trace Manager.Restore: it calls commitTurn after restoring. What parameters does commitTurn receive that indicate this was a restore operation?"
    validation:
      - type: output_contains
        expected: "isRestore"
      - type: output_contains
        expected: "restoredTo"
    tags: ["3-hop", "restore"]

  - id: 3H2
    name: "External file tracking"
    haystack: kvit-coder
    task: "When TrackExternalFile is called, it generates a key for the file. Trace through: what function loads existing mappings, and what format is used for the key (describe the pattern)?"
    validation:
      - type: output_contains
        expected: "loadExternalMappings"
      - type: output_contains
        expected: "counter"
    tags: ["3-hop", "external-files"]

  - id: 3H3
    name: "Safety check pipeline"
    haystack: kvit-coder
    task: "Trace the full safety check pipeline: Checker.Check calls what to parse, then what to handle shell wrappers, then what to apply rules? Name all three functions."
    validation:
      - type: output_contains
        expected: "ParseCommand"
      - type: output_contains
        expected: "UnwrapAll"
      - type: output_contains
        expected: "CheckAll"
    tags: ["3-hop", "pipeline"]

  - id: 3H4
    name: "Audit logging chain"
    haystack: kvit-coder
    task: "When a command is blocked, trace: what Checker method calls audit, what condition must be true for audit to log, and what AuditLogger method is called?"
    validation:
      - type: output_contains
        expected: "audit"
      - type: output_contains
        expected: "Block"
      - type: output_contains
        expected: "LogBlocked"
    tags: ["3-hop", "audit"]

  # ------------------------------------------
  # 4-hop retrieval: follow 4 levels of calls
  # ------------------------------------------

  - id: 4H1
    name: "Tool execution error handling"
    haystack: kvit-coder
    task: "Trace: Runner.executeTools -> executeSingleTool -> when tool.Check fails, what function handles the error, and what struct does it return?"
    validation:
      - type: output_contains
        expected: "handleToolError"
      - type: output_contains
        expected: "backtrackResult"
    tags: ["4-hop", "tool-execution"]

  - id: 4H2
    name: "Loop detection trigger"
    haystack: kvit-coder
    task: "Trace: In runner_iteration, when the agent enters an iteration, what detects loops, what method is called to check, and what happens when maxConsecutive is exceeded?"
    validation:
      - type: output_contains
        expected: "LoopDetector"
      - type: output_contains
        expected: "RecordAndCheck"
      - type: output_contains
        expected: "backtrack"
    tags: ["4-hop", "loop-detection"]

  - id: 4H3
    name: "Benchmark validation chain"
    haystack: kvit-coder
    task: "Trace: benchmark.Runner.RunAll -> Executor.Execute -> after getting LLM response, what creates the validator, what method validates, and what does it return on failure?"
    validation:
      - type: output_contains
        expected: "NewValidator"
      - type: output_contains
        expected: "Validate"
      - type: output_contains
        expected: "validationErrors"
    tags: ["4-hop", "benchmark"]

  - id: 4H4
    name: "Pending edit state analysis"
    haystack: kvit-coder
    task: "Trace: executeSingleTool analyzes pending edit state. What function does this analysis, what does it check in the message history, and what function uses the result to potentially block?"
    validation:
      - type: output_contains
        expected: "AnalyzePendingEditState"
      - type: output_contains
        expected: "CheckPendingEditBlock"
    tags: ["4-hop", "edit-state"]

  # ------------------------------------------
  # 5-hop retrieval: follow 5 levels of calls
  # ------------------------------------------

  - id: 5H1
    name: "Backtrack on tool error"
    haystack: kvit-coder
    task: "Trace the full backtrack flow: executeSingleTool -> handleToolError -> BacktrackTracker. What method on BacktrackTracker is called, what does it check against maxBacktracks, and what field in backtrackResult indicates injection?"
    validation:
      - type: output_contains
        expected: "handleToolError"
      - type: output_contains
        expected: "BacktrackTracker"
      - type: output_contains
        expected: "injectUserMessage"
    tags: ["5-hop", "backtrack"]

  - id: 5H2
    name: "Git rule safety check"
    haystack: kvit-coder
    task: "Trace: Checker.Check -> ParseCommand -> UnwrapAll -> registry.CheckAll -> GitRule.Check. What specific git subcommands does GitRule block, and what action does it return?"
    validation:
      - type: output_contains
        expected: "push"
      - type: output_contains
        expected: "Block"
    tags: ["5-hop", "git-safety"]

  - id: 5H3
    name: "Context overflow recovery"
    haystack: kvit-coder
    task: "Trace: In runner.go, when a context overflow occurs, what field tracks retries, what is the max retry count, and what strategy is used to recover (what gets trimmed from messages)?"
    validation:
      - type: output_contains
        expected: "contextOverflowRetries"
      - type: output_contains
        expected: "trim"
    tags: ["5-hop", "context-overflow"]

  - id: 5H4
    name: "Checkpoint restore verification"
    haystack: kvit-coder
    task: "Trace: Manager.Restore -> what git command checks out the state, then what function commits the restore, what special parameters indicate it was a restore, and what gets recorded in TurnInfo?"
    validation:
      - type: output_contains
        expected: "checkout"
      - type: output_contains
        expected: "commitTurn"
      - type: output_contains
        expected: "isRestore"
      - type: output_contains
        expected: "restoredTo"
    tags: ["5-hop", "checkpoint"]

  # ------------------------------------------
  # Multi-file retrieval: find related items across files
  # ------------------------------------------

  - id: MH1
    name: "All safety rules"
    haystack: kvit-coder
    task: "List all struct types that implement safety rules (types with Rule suffix in the safety package)."
    validation:
      - type: output_contains
        expected: "GitRule"
      - type: output_contains
        expected: "RmRule"
      - type: output_contains
        expected: "XargsRule"
    tags: ["multi-file", "aggregation"]

  - id: MH2
    name: "TurnInfo fields"
    haystack: kvit-coder
    task: "What are all the fields in the TurnInfo struct and their JSON tags?"
    validation:
      - type: output_contains
        expected: "turn"
      - type: output_contains
        expected: "files_changed"
      - type: output_contains
        expected: "is_restore"
    tags: ["multi-file", "struct"]

  - id: MH3
    name: "SafetyConfig features"
    haystack: kvit-coder
    task: "What boolean fields in SafetyConfig control different safety features? List at least 4."
    validation:
      - type: output_contains
        expected: "StrictMode"
      - type: output_contains
        expected: "ParanoidMode"
    tags: ["multi-file", "config"]
