version: 2

builds:
  - id: kvit-coder
    main: ./cmd/kvit-coder
    binary: kvit-coder
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commitHash={{.ShortCommit}}
      - -X main.commitDate={{.CommitDate}}
      - -X main.buildDate={{.Date}}

  - id: kvit-coder-ui
    main: ./cmd/kvit-coder-ui
    binary: kvit-coder-ui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commitHash={{.ShortCommit}}
      - -X main.commitDate={{.CommitDate}}
      - -X main.buildDate={{.Date}}

archives:
  - formats: [tar.gz]
    # Windows convention is zip: a tar.gz with a .exe inside confuses Windows users.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    # install.sh copies config.example.yaml to ~/.kvit-coder/config.yaml when
    # there is no configuration yet, so a release has to carry one: a binary on
    # its own starts by saying it found no config file and there is nothing to
    # copy.
    files:
      - config.example.yaml
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
