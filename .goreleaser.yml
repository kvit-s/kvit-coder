version: 2

# Writes the release's version into both programs' Windows resources, the
# cmd/*/rsrc_windows_*.syso files that hold their icon and the description
# and version Explorer and Task Manager show. It leaves those files changed:
# the release job writes the committed ones back right after goreleaser
# (.github/workflows/release.yml), and after a local run
# `packaging/icons/make-syso.sh` with no version does the same. The check for
# uncommitted changes runs before this hook, so it does not stop the release.
before:
  hooks:
    - packaging/icons/make-syso.sh {{ .Version }}

builds:
  - id: kvit-coder
    main: ./cmd/kvit-coder
    binary: kvit-coder
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commitHash={{.ShortCommit}}
      - -X main.commitDate={{.CommitDate}}
      - -X main.buildDate={{.Date}}

  - id: kvit-coder-ui
    main: ./cmd/kvit-coder-ui
    binary: kvit-coder-ui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commitHash={{.ShortCommit}}
      - -X main.commitDate={{.CommitDate}}
      - -X main.buildDate={{.Date}}

archives:
  - formats: [tar.gz]
    # Windows convention is zip: a tar.gz with a .exe inside confuses Windows users.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    # install.sh copies config.example.yaml to ~/.kvit-coder/config.yaml when
    # there is no configuration yet, so a release has to carry one: a binary on
    # its own starts by saying it found no config file and there is nothing to
    # copy.
    files:
      - config.example.yaml
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
