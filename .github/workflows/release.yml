name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pinned for the same reason as the linter in test.yml: a new release
          # of the tool should not change what a tag produces.
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build portable Windows zips
        # scripts/package-portable.sh names the files with the tag's number
        # (0.3.0, not v0.3.0), matching goreleaser's convention.
        run: scripts/package-portable.sh "${{ github.ref_name }}"

      - name: Upload portable zips to the release
        run: gh release upload "${{ github.ref_name }}" dist/portable/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer:
    # Inno Setup, which compiles the installer, is a Windows program. This
    # waits for the release job because that job creates the GitHub release
    # the installers are uploaded to.
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Inno Setup
        uses: ./.github/actions/inno-setup

      - name: Build the Windows installers
        shell: bash
        run: scripts/package-installer.sh "${{ github.ref_name }}"

      - name: Try the amd64 installer
        shell: pwsh
        run: scripts/test-installer.ps1 -Setup (Get-Item dist/installer/*_windows_amd64_setup.exe).FullName

      - name: Upload the installers to the release
        shell: bash
        run: gh release upload "${{ github.ref_name }}" dist/installer/*_setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
