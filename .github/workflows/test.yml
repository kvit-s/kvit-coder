name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Build for Windows
        # Red gate for the native Windows port (spec/windows.md): the unix
        # build passing while Windows fails is how every port phase starts.
        run: GOOS=windows go build ./...

      - name: Build portable Windows zips
        # Same script the release job uploads; keeps packaging green on every push.
        run: scripts/package-portable.sh

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build on Windows
        run: go build ./...

      - name: Vet on Windows
        # vet type-checks every package including test files, so the port
        # stays compilable. The full suite stays unix-only until the native
        # Windows port lands (spec/windows.md): 74 tests fail there today on
        # unix path assumptions, file-lock semantics, and missing sh/grep,
        # and the TUI proc tests are flaky on headless runners. The ubuntu
        # job above is the test gate.
        run: go vet ./...

      - name: Set up Inno Setup
        uses: ./.github/actions/inno-setup

      - name: Build the Windows installer
        # The same script the release job uploads from, for amd64 only; the
        # arm64 installer differs only in the programs it holds.
        shell: bash
        run: scripts/package-installer.sh --arch amd64

      - name: Try the installer
        # Installs, checks kc and kcu on the PATH, uninstalls, and checks the
        # user PATH is back as it was.
        shell: pwsh
        run: scripts/test-installer.ps1 -Setup (Get-Item dist/installer/*_windows_amd64_setup.exe).FullName

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned: "latest" means a linter release can fail the build with no
          # commit behind it. Raise this deliberately.
          version: v1.64.8
          # The prebuilt v1.64.8 binary was compiled with Go 1.24 and refuses
          # a module that targets Go 1.25; building it with the job's Go works.
          install-mode: goinstall
