# A short working configuration. The installers copy it to
# ~/.kvit-coder/config.yaml (%USERPROFILE%\.kvit-coder\config.yaml on Windows).
#
# It names no model on purpose. Run kcu and it opens :setup, where you choose
# a provider, paste its key and tick the models you want; it saves them to
# ~/.kvit-coder/models.yaml and the key to ~/.kvit-coder/credentials.json, and
# never edits this file. To write a model here by hand instead, fill in the
# llm: keys below for one model, or list several under models: at the end.
#
# Every key is documented at
# https://github.com/kvit-s/kvit-coder/blob/main/docs/configuration.md, which
# also covers what this file leaves out: Model Context Protocol servers, tool
# groups, safety rules, backtracking, prompt templates, diagnostics, and UI
# styling.

llm:
  # One model written by hand: a local llama.cpp, vLLM or Ollama server, or
  # any hosted endpoint that speaks the same protocol.
  #base_url: "http://localhost:8080/v1"
  #model: "the model id the endpoint expects"
  #
  # "chat_completions" for /v1/chat/completions, "responses" for an endpoint
  # that only serves OpenAI's /responses, "messages" for Claude's API.
  #api_backend: "chat_completions"
  #
  # The environment variable holding the API key. A local server usually needs
  # none; a hosted one does, and a refused request names this variable. A key
  # saved by :setup or :keys under the same name is used when it is not set.
  #api_key_env: "OPENAI_API_KEY"
  #
  #context: 131072

  request_timeout: 600     # seconds for one request before it is retried

  # Extra request headers, sent with every model. OpenCode wants these two: it
  # asks a client to name itself, and rejects a request without a session id.
  # ${KVIT_RUN_ID} is one id per conversation, so the conversation stays on the
  # backend that holds its prompt cache. :setup puts them on each OpenCode row
  # it saves, so they are needed here only for OpenCode rows written by hand.
  #headers:
  #  - "User-Agent=kvit-coder"
  #  - "x-opencode-session=kvit-coder-${KVIT_RUN_ID}"

workspace:
  root: "."                     # the directory the command starts in
  path_safety_mode: "ask_once"  # allow | block | warn | ask_once | ask_always

agent:
  # "weak" turns on the machinery for models that mis-format tool calls and
  # miscount line numbers. Leave it at "strong" for a capable model.
  profile: strong
  max_tool_iterations: 1000

tools:
  read:
    enabled: true
  images:
    enabled: true       # the ReadImage tool; -image works whenever it is passed
  edit:
    enabled: true
    mode: "lines"          # "lines", "searchreplace" or "patch"
  search:
    enabled: true
  glob:
    enabled: true
  shell:
    enabled: true
    default_timeout: 120   # seconds a command gets when the call names none
  batch:
    enabled: true          # several independent tool calls in one request
  procs:
    enabled: true             # Shell.start / Shell.output / Observe.wait — work that outlives a turn's iterations
    kill_on_exit: true        # stop everything this session started when a turn is interrupted
  question:
    enabled: true          # let the model ask rather than guess
    timeout: 0             # seconds a run with no terminal waits for an inbox answer (0 = fall back at once)
  subagent:
    enabled: true             # delegate to a child with its own context (research read-only, or general which may edit)
    max_child_iterations: 50  # cap per child; child_max = min(this, parent remaining)
    timeout_s: 300            # whole-Subagent.Call wall-clock
    result_max_chars: 8000    # head kept inline; rest spills to tmp/
    max_concurrent: 8         # how many subagents may run at once; a spawn beyond it fails closed
  report:
    # Whether a turn ends with a validated structured report instead of prose is
    # the --structured flag, not a setting here: kvit-coder-ui passes it for
    # every turn, and "kvit-coder -p" leaves it off unless asked. What follows
    # applies to the runs that do use one.
    mode: mutating           # off | mutating | tools | always
    max_repair_attempts: 3   # rejected reports one turn may resubmit before it is told to stop
    max_blocks: 20           # typed items per report

  # Reaching the network. Enabling one of these is the decision to let the agent
  # out: unlike a shell curl, which is approved per command because the shell
  # can run anything, these two can only search and fetch. Both off unless enabled.
  # kvit-coder-ui's :setup turns them on without editing this file and saves the
  # key; an enabled: written here takes precedence over what :setup saved.
  #web:
  #  api_key_env: "BRAVE_API_KEY"  # environment variable holding the search key
  #  search:
  #    enabled: true
  #  fetch:
  #    enabled: true

# Release updates, kvit-coder-ui only. The UI checks GitHub at most once a
# day, prints one line when a newer release exists, and :update installs it
# (verified against the release checksums). The headless agent never checks.
#updates:
#  enabled: true          # false turns the background check off; :update --check still works
#  interval_hours: 24     # minimum time between automatic checks

# Several models to switch between: :m1, :m2, ... in the UI (in list order),
# or --model headless. The rows :setup saves in ~/.kvit-coder/models.yaml come
# after these, in the same format. docs/models.md has more OpenCode rows. Give
# every row its own base_url, model, api_backend, api_key_env and context: once
# models: is used, the selected row supplies those, and llm: above keeps only
# what applies to every model (headers, request_timeout, ...). efforts: are the
# levels offered as :e1, :e2, ...; a row without them is a model without
# reasoning.
#models:
