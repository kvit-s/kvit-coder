# A short working configuration. Copy it to ~/.kvit-coder/config.yaml
# (%USERPROFILE%\.kvit-coder\config.yaml on Windows) and point
# the llm: block at whichever OpenAI-compatible endpoint you have.
#
# Every key is documented at
# https://github.com/kvit-s/kvit-coder/blob/main/docs/configuration.md, which
# also covers what this file leaves out: several models to switch between, Model
# Context Protocol servers, tool groups, checkpoints and the safety rules.

llm:
  # A local llama.cpp, vLLM or Ollama server, or any hosted endpoint that
  # speaks the same protocol.
  base_url: "http://localhost:8080/v1"
  model: "your-model"

  # "chat_completions" for /v1/chat/completions, "responses" for an endpoint
  # that only serves OpenAI's /responses.
  api_backend: "chat_completions"

  # The environment variable holding the API key. A local server usually needs
  # none; a hosted one does, and a refused request names this variable.
  api_key_env: "OPENAI_API_KEY"

  context: 131072
  request_timeout: 600     # seconds for one request before it is retried

workspace:
  root: "."                     # the directory the command starts in
  path_safety_mode: "ask_once"  # allow | block | warn | ask_once | ask_always

agent:
  # "weak" turns on the machinery for models that mis-format tool calls and
  # miscount line numbers. Leave it at "strong" for a capable model.
  profile: strong
  max_tool_iterations: 1000

tools:
  read:
    enabled: true
  edit:
    enabled: true
    mode: "lines"          # "lines", "searchreplace" or "patch"
  search:
    enabled: true
  shell:
    enabled: true
    default_timeout: 120   # seconds a command gets when the call names none
  batch:
    enabled: true          # several independent tool calls in one request
  question:
    enabled: true          # let the model ask rather than guess
  # Web search and page fetching, both off unless enabled. Web.search queries
  # the Brave Search API and needs an API key; Web.fetch reads one page as
  # markdown and needs no key.
  #web:
  #  api_key_env: "BRAVE_API_KEY"  # environment variable holding the key
  #  search:
  #    enabled: true
  #  fetch:
  #    enabled: true

# GitHub Copilot, on a machine where Copilot CLI is already signed in.
# `kvit-coder copilot models` prints the model ids that account can call.
# Leave api_backend empty so the account's model list picks the protocol.
# base_url forces an origin (no /v1 suffix) when the token exchange returns
# one the network blocks. copilot_host is a GitHub Enterprise hostname.
