#    name: "Muse Spark 1.3 Go"
#    model: "muse-spark-1.3-contributor"
#    base_url: "https://opencode.ai/zen/go/v1"
#    api_backend: "responses"
#    api_key_env: "OPENCODE_API_KEY"
#    context: 1048576
#    efforts:
#      - value: medium
#      - value: high
#      - value: xhigh
#        default: true          # the level a session starts at
#  - id: local
#    name: "Local model"
#    model: "qwen3-coder"
#    base_url: "http://localhost:8080/v1"
#    api_backend: "chat_completions"
#    context: 131072
#    profile: weak              # this row only: backtracking, fuzzy edit matching and other checks for a weaker model
#
# The row a new session starts on: an id, display name, 1-based index or model
# id from the list above. Empty means the row whose model matches llm.model,
# else the first row.
#default_model: spark-go
# The starting effort for a row with no `default: true` level, when
# llm.reasoning_effort is empty too.
#default_effort: medium
